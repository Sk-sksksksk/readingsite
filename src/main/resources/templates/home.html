<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Readingsite · Stories, journals, ghazals and quotes</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main id="main" class="wrap">

    <section class="hero">
        <h1>Something quiet to read</h1>
        <p>Short stories, journal pages, ghazals and quotes, in Hindi and in English.</p>
        <p class="lang-links">
            <a class="button" th:href="@{/browse(lang='HI')}" lang="hi">हिन्दी पढ़ें</a>
            <a class="button" th:href="@{/browse(lang='EN')}">Read in English</a>
        </p>
    </section>

    <section aria-labelledby="mood-heading">
        <h2 id="mood-heading">How are you feeling today?</h2>
        <ul class="chips">
            <li th:each="mood : ${moods}">
                <a class="chip" th:href="@{/moods/{slug}(slug=${mood.slug})}" th:text="${mood.name}">Peaceful</a>
            </li>
        </ul>
    </section>

    <section th:if="${featured != null}" aria-labelledby="featured-heading">
        <h2 id="featured-heading">Featured</h2>
        <div th:replace="~{fragments :: pieceCard(${featured})}"></div>
    </section>

    <section aria-labelledby="collections-heading">
        <h2 id="collections-heading">Collections</h2>
        <ul class="card-grid">
            <li class="card" th:each="c : ${collections}">
                <h3><a th:href="@{/collections/{slug}(slug=${c.slug})}" th:text="${c.name}">Collection</a></h3>
                <p th:text="${c.description}">Description</p>
            </li>
        </ul>
    </section>

    <section aria-labelledby="recent-heading">
        <h2 id="recent-heading">Recently added</h2>
        <div class="card-grid">
            <th:block th:each="p : ${recent}">
                <div th:replace="~{fragments :: pieceCard(${p})}"></div>
            </th:block>
        </div>
    </section>

</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
