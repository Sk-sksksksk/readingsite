<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Owner login · Librarium</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main id="main" class="wrap narrow">
    <h1>Owner login</h1>

    <p class="error-summary" role="alert" th:if="${param.error}">
        That username or password was not right. Please try again.
    </p>

    <form th:action="@{/admin/login}" method="post" class="stack">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div><button type="submit" class="button">Log in</button></div>
    </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
